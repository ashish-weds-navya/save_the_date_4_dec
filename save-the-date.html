<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#63121b">
  <meta name="description" content="Save the Date — Ashish &amp; Navya, 4 December 2026, Govind Bagh, Jodhpur.">
  <meta property="og:title" content="Save the Date | Ashish &amp; Navya | 4 Dec 2026">
  <meta property="og:description" content="Ashish &amp; Navya — 4 December 2026 — Govind Bagh, Jodhpur.">
  <meta property="og:image" content="https://drive.google.com/thumbnail?id=1rRtefG6a7BQ02axwxlnqxio9-aIaUwmL&sz=w800">
  <title>Save the Date | Ashish &amp; Navya</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Alex+Brush&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Serif+Devanagari:wght@400;600;700;800&family=Noto+Serif+Kannada:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-ivory: #fbf7ef;
      --bg-parchment: #f4ead6;
      --text-dark: #2a1f1b;
      --text-soft: #5a4a43;
      --nav-bg: rgba(255, 252, 245, 0.88);

      --gold: #c9a227;
      --gold-bright: #e8c766;
      --gold-deep: #9a6f12;
      --gold-light: #f3e5ab;
      --maroon: #63121b;
      --maroon-deep: #3f0a11;
      --maroon-soft: #8a2a35;

      --gold-foil: linear-gradient(120deg, #8a5a00 0%, #c9a227 22%, #f6e08a 48%, #c9a227 72%, #8a5a00 100%);
      --maroon-foil: linear-gradient(120deg, #3f0a11 0%, #7a1a26 45%, #3f0a11 100%);

      --font-royal: 'Cinzel', 'Noto Sans Devanagari', 'Noto Sans Kannada', serif;
      --font-serif: 'Cormorant Garamond', 'Noto Sans Devanagari', 'Noto Sans Kannada', serif;
      --font-sans: 'Montserrat', 'Noto Sans Devanagari', 'Noto Sans Kannada', sans-serif;
      --font-script: 'Great Vibes', 'Cormorant Garamond', cursive;

      --shadow-soft: 0 10px 35px rgba(63, 10, 17, 0.08);
      --shadow-gold: 0 18px 45px rgba(201, 162, 39, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background-color: var(--bg-ivory);
      color: var(--text-dark);
      font-family: var(--font-sans);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection { background: var(--gold-light); color: var(--maroon); }

    /* ---------- ambient layers ---------- */
    #cursor-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
    #petal-container { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .petal {
      position: absolute; top: -8%; opacity: 0; will-change: transform, opacity;
      animation: petalFall linear infinite;
      border-radius: 80% 0 80% 0;
      box-shadow: inset -2px -3px 6px rgba(0,0,0,.12), 0 2px 5px rgba(63,10,17,.12);
    }
    @keyframes petalFall {
      0%   { transform: translate3d(0,-8vh,0) rotateZ(0deg) rotateX(0deg); opacity: 0; }
      8%   { opacity: .9; }
      25%  { transform: translate3d(34px,24vh,0) rotateZ(70deg) rotateX(120deg); }
      50%  { transform: translate3d(-26px,52vh,0) rotateZ(150deg) rotateX(260deg); }
      75%  { transform: translate3d(30px,80vh,0) rotateZ(240deg) rotateX(400deg); opacity: .85; }
      100% { transform: translate3d(-10px,112vh,0) rotateZ(330deg) rotateX(540deg); opacity: 0; }
    }

    /* ---------- ornaments ---------- */
    .ornament-divider {
      display: flex; align-items: center; justify-content: center; gap: 0.9rem;
      margin: 0 auto 1.1rem; max-width: 300px; color: var(--gold);
    }
    .ornament-divider::before, .ornament-divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .ornament-divider svg { width: 26px; height: 26px; flex-shrink: 0; }

    .gold-text {
      background: var(--gold-foil); background-size: 220% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: foil 7s ease-in-out infinite alternate;
    }
    @keyframes foil { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }

    /* Hindi / Kannada: serif Indic faces so they sit naturally beside Cinzel / Cormorant */
    html[lang="hi"] { --font-royal: 'Cinzel', 'Noto Serif Devanagari', 'Noto Sans Devanagari', serif; --font-serif: 'Cormorant Garamond', 'Noto Serif Devanagari', 'Noto Sans Devanagari', serif; --font-sans: 'Montserrat', 'Noto Sans Devanagari', sans-serif; }
    html[lang="kn"] { --font-royal: 'Cinzel', 'Noto Serif Kannada', 'Noto Sans Kannada', serif; --font-serif: 'Cormorant Garamond', 'Noto Serif Kannada', 'Noto Sans Kannada', serif; --font-sans: 'Montserrat', 'Noto Sans Kannada', sans-serif; }
    html[lang="hi"] body, html[lang="kn"] body { line-height: 1.6; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { font-variant-numeric: lining-nums; }
    .parentage-subtitle .pl, .host-blessing-text { overflow-wrap: anywhere; }
    html[lang="hi"] .footer-title, html[lang="kn"] .footer-title { font-family: var(--font-royal); font-weight: 700; line-height: 1.4; }
    /* Hindi / Kannada: no tracking (breaks conjuncts), no gradient-clip (clips matras) */
    html[lang="hi"] *, html[lang="kn"] * { letter-spacing: 0 !important; text-transform: none !important; }
    html[lang="hi"] .couple-name, html[lang="kn"] .couple-name {
      background: none; -webkit-text-fill-color: var(--maroon); color: var(--maroon); filter: none; line-height: 1.25; padding: .06em .1em .06em;
    }
    html[lang="hi"] .weds-separator, html[lang="kn"] .weds-separator {
      font-family: var(--font-serif); font-weight: 700; background: none; animation: none; filter: none;
      -webkit-text-fill-color: var(--gold-deep); color: var(--gold-deep); line-height: 1.25; padding: .05em .2em .1em;
    }

    /* ---------- navigation ---------- */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
      padding: 0.7rem clamp(0.8rem, 3vw, 2rem);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.6rem;
      z-index: 100;
      border-bottom: 1px solid rgba(201,162,39,0.3);
      box-shadow: 0 4px 24px rgba(63,10,17,0.06);
    }
    nav::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .7;
    }
    .nav-left { display: flex; align-items: center; gap: 1.4rem; }
    .nav-logo { white-space: nowrap; flex-shrink: 0;
      font-family: 'Alex Brush', var(--font-script); font-weight: 400; -webkit-text-stroke: .5px currentColor; letter-spacing: .02em; font-size: 2.2rem; line-height: 1; cursor: pointer;
      text-decoration: none; color: var(--maroon); padding: 0 .2rem; font-weight: 400;
    }
    .nav-links { display: flex; gap: 0.45rem; list-style: none; flex-wrap: wrap; align-items: center; }
    .nav-links a {
      text-decoration: none; color: var(--maroon); cursor: pointer; display: inline-block;
      font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700;
      padding: 0.42rem 1rem; border-radius: 30px;
      border: 1px solid rgba(201,162,39,0.4); background: rgba(255,255,255,0.7);
      transition: all .3s ease;
    }
    .nav-links a:hover, .nav-links a.active-tab {
      background: var(--gold-foil); color: #fff; border-color: transparent;
      box-shadow: 0 5px 14px rgba(201,162,39,0.35); transform: translateY(-1px);
    }

    /* one consistent layout on every device: logo | page tabs | language, all in a single row */
    nav { flex-wrap: nowrap; align-items: center; justify-content: space-between; padding: .5rem clamp(.5rem, 2.5vw, 2rem); column-gap: clamp(.3rem, 1.6vw, 1rem); row-gap: 0; }
    .nav-left { display: contents; }
    .nav-logo { order: 1; font-size: clamp(1.5rem, 6vw, 2rem); padding: 0 .1rem; }
    .nav-links { order: 2; flex: 1 1 auto; min-width: 0; justify-content: center; flex-wrap: nowrap; gap: clamp(.15rem, 1vw, .5rem); }
    .nav-links a { font-size: clamp(.5rem, 2.1vw, .72rem); padding: .38rem clamp(.3rem, 1.6vw, 1.1rem); letter-spacing: .03em; white-space: nowrap; }
    html[lang="hi"] .nav-links a, html[lang="kn"] .nav-links a { font-size: clamp(.55rem, 2.3vw, .8rem); }
    .lang-tabs-wrap { order: 3; flex-shrink: 0; }
    .lang-tab-btn .ls { display: none; }
    @media (max-width: 380px) {
      nav { padding-left: .4rem; padding-right: .4rem; column-gap: .25rem; }
      .nav-logo { font-size: 1.3rem; }
      .nav-links { gap: .12rem; }
      .nav-links a { font-size: .5rem; padding: .34rem .3rem; letter-spacing: .01em; }
      html[lang="hi"] .nav-links a, html[lang="kn"] .nav-links a { font-size: .56rem; }
      .lang-tab-btn { padding: .28rem .38rem !important; }
    }
    @media (max-width: 340px) {
      .nav-logo { font-size: 1.1rem; }
      .nav-links a { font-size: .44rem; padding: .32rem .22rem; }
      html[lang="hi"] .nav-links a, html[lang="kn"] .nav-links a { font-size: .5rem; }
      .lang-tab-btn { padding: .26rem .3rem !important; font-size: .64rem !important; }
    }
    @media (max-width: 600px) {
      .lang-tab-btn .lf { display: none; } .lang-tab-btn .ls { display: inline; }
      .lang-tabs-wrap { gap: .1rem; padding: .16rem; }
      .lang-tab-btn { padding: .3rem .5rem; font-size: .7rem; }
      html[lang="hi"] .lang-tab-btn, html[lang="kn"] .lang-tab-btn { font-size: .78rem; }
    }
    .lang-tabs-wrap {
      display: flex; gap: .2rem; padding: .22rem; border-radius: 30px;
      background: rgba(201,162,39,0.1); border: 1px solid rgba(201,162,39,0.35);
    }
    .lang-tab-btn {
      background: transparent; border: none; color: var(--maroon); cursor: pointer;
      padding: .32rem clamp(.4rem, 2.2vw, .8rem); border-radius: 24px; font-size: clamp(.64rem, 2.6vw, .74rem); font-weight: 700; font-family: inherit;
      transition: all .25s ease;
    }
    .lang-tab-btn:hover { background: rgba(201,162,39,0.22); }
    .lang-tab-btn.active-lang { background: var(--maroon); color: var(--gold-light); box-shadow: 0 3px 10px rgba(99,18,27,.3); }

    /* ---------- page views ---------- */
    .page-view { --nav-h: 4.3rem; display: none; min-height: 100vh; padding-top: var(--nav-h); position: relative; z-index: 2; }
    .page-view.active-page { display: block; animation: pageIn .5s ease both; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .reveal { opacity: 0; transform: translateY(26px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
    .reveal.in { opacity: 1; transform: none; }

    /* poster background: covers hero -> contacts, stops before the venue */
    .poster-bg, .page-view.poster-page {
      background-color: var(--bg-ivory);
      background-image: linear-gradient(rgba(250,247,242,.82), rgba(250,247,242,.82)),
                        url('https://drive.google.com/thumbnail?id=1HZtAvCUXRws8vjP1196XutlPZYsUq0KA&sz=w1920');
      background-repeat: no-repeat; background-position: center top; background-size: cover;
    }
    .poster-bg { margin-top: calc(var(--nav-h) * -1); padding-top: var(--nav-h); position: relative; }

    /* ---------- hero ---------- */
    .hero {
      position: relative; min-height: auto;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      padding: clamp(.2rem, .8vw, .6rem) 1rem clamp(.6rem, 1.5vw, 1rem); overflow: visible;
    }
    /* twinkling gold sparkles around the jharokha */
    .sparkles { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: visible; }
    .spk { position: absolute; opacity: 0; background: #d4af37; animation: twinkle var(--d, 5s) ease-in-out var(--dl, 0s) infinite; }
    .spk.star { clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
    .spk.dot { border-radius: 50%; background: radial-gradient(circle, #f1d77a 0%, #d4af37 55%, rgba(212,175,55,0) 100%); }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg) translateY(0); }
      45%, 55% { opacity: var(--o, .6); transform: scale(1) rotate(45deg) translateY(var(--dy, -6px)); }
    }
    .hero-content { position: relative; z-index: 2; width: 100%; max-width: 900px; margin: 0 auto; }

    .divine-blessing { display: flex; align-items: center; justify-content: center; gap: clamp(.9rem, 3vw, 2rem); margin-bottom: .35rem; }
    .divine-blessing svg { width: clamp(46px, 6vw, 64px); height: clamp(46px, 6vw, 64px); flex-shrink: 0; filter: drop-shadow(0 4px 10px rgba(218,165,32,.6)); animation: glowPulse 4s ease-in-out infinite alternate; }
    @keyframes glowPulse { from { filter: drop-shadow(0 3px 6px rgba(218,165,32,.4)); } to { filter: drop-shadow(0 5px 16px rgba(218,165,32,.85)); } }
    .divine-blessing span {
      font-family: var(--font-serif); font-size: clamp(1.15rem, 2.5vw, 1.55rem); font-weight: 700;
      color: var(--gold-deep); text-shadow: 0 1px 3px rgba(184,134,11,.3);
    }

    /* soft invitation card */
    @media (max-width: 520px) { .hero { padding-left: .4rem; padding-right: .4rem; } }
    .page-view, .poster-bg, .hero { overflow-x: clip; }
    html, body { overflow-x: hidden; }
    .jh-wrap { position: relative; max-width: 680px; margin: 8px auto 10px; }
    .jh-line { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 3; }
    .arch-frame {
      position: relative; margin: 0 auto;
      padding: var(--jh-pt, 150px) var(--jh-p, 30px) var(--jh-pb, 40px);
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    /* grandparents / parents lines: identical type, thin hairline between them */
    .parentage-subtitle .pl { font: inherit; letter-spacing: inherit; }
    .parentage-subtitle .pl + .pl { margin-top: .4em; }

    .sticker-couple {
      display: block; width: clamp(100px, 14vw, 140px); height: auto; max-height: 180px; object-fit: contain;
      margin: 0 auto .5rem; filter: drop-shadow(0 8px 16px rgba(99,18,27,.18));
      animation: cuteBounce 3.4s ease-in-out infinite alternate;
    }
    @keyframes cuteBounce { to { transform: translateY(-8px); } }

    .host-blessing-text {
      font-family: var(--font-serif); font-style: italic; font-weight: 600;
      font-size: clamp(1rem, 2vw, 1.3rem); color: var(--gold-deep);
      max-width: 560px; margin: 0 auto 1.1rem; line-height: 1.5;
    }

    .couple-hero-container { display: flex; flex-direction: column; align-items: center; gap: 0; margin-bottom: .5rem; }
    .person-block { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .parentage-subtitle .pl { display: block; width: max-content; margin: 0 auto; white-space: nowrap; }
    .parentage-subtitle.wrapl .pl { width: auto; max-width: 100%; white-space: normal; text-wrap: balance; line-height: 1.4; }
    .person-block .couple-name {
      font-family: var(--font-royal); font-weight: 800; letter-spacing: .01em; line-height: 1.12; padding: .03em .1em .04em;
      font-size: clamp(2.1rem, 6.4vw, 3.7rem);
      background: var(--maroon-foil); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 10px rgba(99,18,27,.14));
    }
    .person-block .parentage-subtitle {
      font-family: var(--font-serif); font-weight: 700; text-transform: none;
      font-size: 1rem; letter-spacing: .01em; line-height: 1.5;
      color: var(--text-soft); margin-top: .05rem; width: 100%;
    }
    .weds-separator {
      margin: .3rem 0 0; font-family: var(--font-script); text-transform: none;
      font-size: clamp(1.9rem, 4.6vw, 2.8rem); line-height: 1.1; letter-spacing: 0; padding: 0 .15em .06em;
      background: none; -webkit-text-fill-color: var(--gold-deep); color: var(--gold-deep); animation: none; filter: none; text-shadow: none;
    }

    .hero-date { display: flex; flex-direction: column; align-items: center; gap: .1rem; margin: .45rem 0 0; }
    .hero-date .hd-day, .hero-date .hd-venue { white-space: nowrap; }
    .hero-date .hd-day {
      font-family: var(--font-royal); font-weight: 800; font-size: clamp(1.25rem, 5.2vw, 1.9rem); line-height: 1.25;
      color: var(--gold-deep); letter-spacing: .04em; padding: 0 .2em;
      display: inline-flex; align-items: center; gap: .6em;
    }
    .hero-date .hd-day::before, .hero-date .hd-day::after { content: ''; width: clamp(18px, 5vw, 38px); height: 1.5px; background: linear-gradient(90deg, transparent, var(--gold)); }
    .hero-date .hd-day::after { background: linear-gradient(270deg, transparent, var(--gold)); }
    .hero-date .hd-venue { font-family: var(--font-serif); font-weight: 700; font-size: clamp(1rem, 2.4vw, 1.3rem); color: var(--maroon); letter-spacing: .02em; }

    .timer-container { display: flex; justify-content: center; flex-wrap: wrap; gap: clamp(.5rem, 1.6vw, 1rem); }
    .timer-box { text-align: center;
      min-width: clamp(64px, 11vw, 88px); padding: clamp(.65rem, 1.5vw, 1rem) .4rem;
      border-radius: 14px; background: rgba(255,255,255,.9);
      border: 1px solid rgba(201,162,39,.4); box-shadow: 0 6px 18px rgba(63,10,17,.07);
    }
    .timer-number { font-family: var(--font-royal); font-weight: 700; font-size: clamp(1.5rem, 3.2vw, 2.1rem); color: var(--maroon); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .timer-label { font-size: clamp(.5rem, .85vw, .62rem); letter-spacing: .1em; text-transform: uppercase; color: var(--text-soft); font-weight: 700; margin-top: .25rem; }

    .scroll-hint { display: none; margin-top: 1.6rem; color: var(--gold-deep); font-size: 1.4rem; animation: bob 1.8s ease-in-out infinite; opacity: .8; }
    @keyframes bob { 50% { transform: translateY(7px); } }

    /* ---------- sections ---------- */
    section { padding: clamp(1.6rem, 3.5vw, 2.6rem) 1.25rem; max-width: 950px; margin: 0 auto; position: relative; z-index: 2; }
    .section-title {
      font-family: var(--font-royal); font-weight: 800; text-align: center; letter-spacing: .01em;
      font-size: clamp(1.8rem, 3.8vw, 2.6rem); margin-bottom: .3rem;
      color: var(--maroon);
    }

    /* event cards */
    .events-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(.8rem, 2.5vw, 1.8rem); max-width: 820px; margin: 0 auto; }
    .event-card {
      position: relative; overflow: hidden; cursor: pointer; text-align: center;
      background: linear-gradient(180deg, #fff, #fffaf0);
      border: 1px solid rgba(201,162,39,.4); border-radius: 18px;
      padding: clamp(1.5rem, 3vw, 2.4rem) clamp(.8rem, 2vw, 1.6rem);
      box-shadow: var(--shadow-soft);
      transition: transform .45s cubic-bezier(.2,.7,.2,1), box-shadow .45s ease, border-color .45s ease;
    }
    .event-card::before, .event-card::after {
      content: ''; position: absolute; width: 26px; height: 26px; border: 2px solid var(--gold); opacity: .7; transition: .4s;
    }
    .event-card::before { top: 9px; left: 9px; border-width: 2px 0 0 2px; border-radius: 8px 0 0 0; }
    .event-card::after { bottom: 9px; right: 9px; border-width: 0 2px 2px 0; border-radius: 0 0 8px 0; }
    .event-card:hover { transform: translateY(-8px); border-color: var(--gold); box-shadow: var(--shadow-gold); }
    .event-card:hover::before, .event-card:hover::after { width: 40px; height: 40px; opacity: 1; }
    .event-icon { margin-bottom: .5rem; } .event-icon svg { width: clamp(44px, 7vw, 60px); height: clamp(44px, 7vw, 60px); }
    .modal-hero-icon svg { width: 34px; height: 34px; }
    .event-card h3 { font-family: var(--font-royal); font-size: clamp(1.05rem, 2.2vw, 1.5rem); color: var(--maroon); margin-bottom: .35rem; }
    .event-card p { font-family: var(--font-serif); font-weight: 700; font-size: clamp(.95rem, 1.5vw, 1.2rem); color: var(--text-soft); }
    .event-card p.ev-day { white-space: nowrap; font-family: var(--font-royal); font-weight: 800; font-size: clamp(1.05rem, 2.3vw, 1.45rem); color: var(--gold-deep); line-height: 1.35; margin-bottom: .1rem; }
    .event-card p.ev-time { font-size: clamp(1rem, 1.7vw, 1.3rem); color: var(--maroon); margin-bottom: .2rem; }

    html[lang="hi"] .venue-scan, html[lang="kn"] .venue-scan { font-size: clamp(.82rem, 1.2vw, .95rem); }
    html[lang="hi"] .contact-card h3, html[lang="kn"] .contact-card h3 { font-size: clamp(.95rem, 1.3vw, 1.05rem); }
    html[lang="hi"] .lang-tab-btn, html[lang="kn"] .lang-tab-btn { font-size: .85rem; }
    .card-btn {
      display: inline-block; margin-top: .9rem; padding: .4rem 1.2rem; border-radius: 30px; pointer-events: none;
      border: 1px solid var(--gold); color: var(--gold-deep); font-weight: 700; font-size: clamp(.66rem, 1vw, .8rem); letter-spacing: .04em; text-transform: uppercase; transition: .3s;
    }

    .cal-row { text-align: center; margin-top: 1.1rem; }
    .cal-btn {
      display: inline-flex; align-items: center; gap: .55rem; cursor: pointer;
      padding: .7rem 1.5rem; border-radius: 30px; border: 1.5px solid var(--maroon); background: transparent; color: var(--maroon);
      font-family: var(--font-sans); font-weight: 700; font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; transition: .3s;
    }
    .cal-btn:hover { background: var(--maroon); color: var(--gold-light); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,18,27,.25); }

    /* contacts */
    .contacts-wrapper { max-width: 820px; margin: 0 auto; }
    .contacts-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
    .contact-card {
      flex: 0 1 calc(33.333% - 1rem); min-width: 210px; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.1rem .7rem; background: #fff; border: 1px solid rgba(201,162,39,.35); border-radius: 14px;
      box-shadow: 0 5px 18px rgba(0,0,0,.04); transition: .35s;
    }
    .contact-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 12px 26px rgba(201,162,39,.22); }
    .contact-card h3 { font-family: var(--font-royal); font-size: clamp(.8rem, 1.1vw, .95rem); color: var(--maroon); margin-bottom: .35rem; line-height: 1.25; }
    .contact-card a {
      display: inline-flex; align-items: center; gap: .4rem; color: var(--gold-deep); text-decoration: none;
      font-weight: 700; font-size: clamp(.74rem, 1vw, .86rem);
    }
    .contact-card a::before { content: '📞'; font-size: .85em; }
    .contact-card a:hover { text-decoration: underline; }

    .whatsapp-container {
      max-width: 440px; margin: clamp(1.1rem, 2.5vw, 1.6rem) auto 0; text-align: center;
      padding: clamp(1.4rem, 3vw, 2.1rem) clamp(1rem, 2.5vw, 2rem);
      background: linear-gradient(180deg, #fff, #fffaf0); border: 1px solid rgba(201,162,39,.4); border-radius: 18px; box-shadow: var(--shadow-soft);
    }
    .whatsapp-qr {
      display: block; width: clamp(120px, 20vw, 156px); height: clamp(120px, 20vw, 156px); object-fit: contain;
      margin: .9rem auto; padding: 6px; background: #fff; border-radius: 12px; border: 2px solid var(--gold); transition: transform .3s;
    }
    .whatsapp-qr:hover { transform: scale(1.04) rotate(-1deg); }
    .whatsapp-join-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .65rem; width: 100%; margin-top: .6rem;
      padding: .85rem 1.2rem; border-radius: 30px; text-decoration: none; color: #fff;
      background: linear-gradient(135deg, #25d366, #128c7e); box-shadow: 0 5px 16px rgba(37,211,102,.35);
      font-weight: 700; font-size: clamp(.75rem, 1.1vw, .88rem); text-transform: uppercase; letter-spacing: .04em; transition: .3s;
    }
    .whatsapp-join-btn svg { width: 22px; height: 22px; fill: #fff; flex-shrink: 0; }
    .whatsapp-join-btn:hover { transform: translateY(-2px); box-shadow: 0 9px 22px rgba(37,211,102,.5); }

    /* venue */
    .venue-card {
      position: relative; overflow: hidden; text-align: center; max-width: 820px; margin: 0 auto;
      padding: clamp(1.8rem, 3.5vw, 2.8rem) clamp(1rem, 2.5vw, 2.4rem);
      background: rgba(255,251,242,.96); border-radius: 20px;
      border: 2px solid rgba(201,162,39,.55); box-shadow: 0 16px 45px rgba(63,10,17,.1);

    }
    .venue-card::before {
      content: ''; position: absolute; inset: 0; z-index: 0; opacity: .12;
      background: url('https://drive.google.com/thumbnail?id=1KcBr6URxb3d_5zSnaLuh1pRyTVp-minZ&sz=w1920') center/cover no-repeat;
    }
    .venue-card > * { position: relative; z-index: 1; }
    .venue-card h3 { font-family: var(--font-royal); color: var(--maroon); font-size: clamp(1.3rem, 2.6vw, 1.95rem); margin-bottom: .8rem; }
    .venue-desc-text { font-size: clamp(1rem, 1.35vw, 1.2rem); line-height: 1.75; margin: 0 auto 1.4rem; max-width: 640px; }
    .venue-interactive-row { display: flex; align-items: center; justify-content: center; gap: 1.6rem; margin-bottom: 1.4rem; flex-wrap: wrap; }
    .venue-qr { width: clamp(120px, 18vw, 170px); height: clamp(120px, 18vw, 170px); object-fit: contain; padding: 6px; background: #fff; border-radius: 12px; border: 2px solid var(--gold); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    .venue-action-col { display: flex; flex-direction: column; align-items: center; gap: .6rem; }
    .venue-scan { font-family: var(--font-sans); font-size: clamp(.7rem, 1vw, .82rem); font-weight: 700; text-transform: uppercase; color: var(--gold-deep); letter-spacing: .06em; }
    .venue-map-btn {
      display: inline-block; padding: .7rem 1.6rem; border-radius: 30px; text-decoration: none; color: #fff;
      background: var(--maroon-foil); border: 1px solid var(--gold);
      font-family: var(--font-sans); font-weight: 700; font-size: clamp(.72rem, 1vw, .84rem); letter-spacing: .08em; text-transform: uppercase;
      box-shadow: 0 6px 16px rgba(99,18,27,.3); transition: .3s;
    }
    .venue-map-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(99,18,27,.4); }
    .cab-notice {
      max-width: 650px; margin: 0 auto; text-align: left; padding: .95rem 1.2rem; border-radius: 10px;
      background: rgba(201,162,39,.12); border-left: 4px solid var(--gold); color: var(--maroon);
      font-family: var(--font-sans); font-size: clamp(.8rem, 1.1vw, .93rem); line-height: 1.65;
    }

    /* wishes */
    .wishes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.3rem; align-items: start; padding: 10px 4px; }
    .wish-card {
      position: relative; padding: 1.4rem 1.3rem 1.2rem; background: #fff; border-radius: 12px; border-left: 4px solid var(--gold);
      box-shadow: var(--shadow-soft); font-family: var(--font-serif); font-size: 1.15rem; font-style: italic; word-break: break-word;
    }
    .wish-card::before { content: '“'; position: absolute; top: -.1rem; right: .8rem; font-size: 3.4rem; color: rgba(201,162,39,.3); font-family: var(--font-serif); }
    .wish-author { display: block; margin-top: .6rem; font-family: var(--font-royal); font-style: normal; font-size: .74rem; letter-spacing: .1em; color: var(--maroon); font-weight: 700; }

    /* modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 1rem;
      background: rgba(30,6,10,.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      opacity: 0; visibility: hidden; transition: .4s ease;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content {
      position: relative; width: 100%; max-width: 760px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
      background: #fffdf7; border: 2px solid var(--gold); border-radius: 22px; text-align: center;
      box-shadow: 0 30px 70px rgba(0,0,0,.45);
      transform: scale(.94) translateY(30px); transition: .5s cubic-bezier(.2,.7,.2,1);
    }
    .modal-overlay.active .modal-content { transform: none; }
    .modal-content::before, .modal-content::after { content: ''; position: absolute; width: 36px; height: 36px; z-index: 3; pointer-events: none; border: 0 solid var(--gold); }
    .modal-content::before { top: 10px; left: 10px; border-width: 2px 0 0 2px; border-radius: 10px 0 0 0; }
    .modal-content::after { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; border-radius: 0 0 10px 0; }
    .close-modal {
      position: absolute; top: 14px; right: 14px; z-index: 4; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255,255,255,.9); color: var(--maroon); font-size: 1.8rem; line-height: 1; cursor: pointer; border: 0;
      box-shadow: 0 3px 12px rgba(0,0,0,.2); transition: .3s;
    }
    .close-modal:hover { transform: rotate(90deg); color: var(--gold-deep); }
    .modal-hero { position: relative; height: clamp(170px, 30vh, 250px); flex-shrink: 0; display: flex; align-items: flex-end; justify-content: center; background: var(--gold-light); }
    .modal-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 20px 20px 0 0; }
    .modal-hero-overlay { position: absolute; inset: 0; border-radius: 20px 20px 0 0; background: linear-gradient(to top, #fffdf7 0%, rgba(255,253,247,.65) 28%, rgba(255,253,247,0) 100%); }
    .modal-hero-icon { position: relative; z-index: 2; margin-bottom: -26px; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fff; border: 2px solid var(--gold); font-size: 1.6rem; box-shadow: 0 6px 18px rgba(201,162,39,.4); }
    .modal-body { padding: 3rem 1.6rem 2rem; overflow-y: auto; }
    .modal-body h2 { font-family: var(--font-royal); font-size: clamp(1.7rem, 4vw, 2.3rem); margin-bottom: .4rem; color: var(--maroon); }
    .modal-body .time { font-family: var(--font-sans); font-weight: 700; letter-spacing: .08em; font-size: .9rem; color: var(--maroon); margin-bottom: .8rem; }
    .modal-desc { font-family: var(--font-serif); font-size: clamp(1.15rem, 2.4vw, 1.45rem); line-height: 1.6; color: var(--text-dark); }
    .modal-loc { color: var(--gold-deep); letter-spacing: .05em; text-transform: uppercase; font-weight: 700; font-size: .85rem; margin-top: 1.4rem; }

    /* forms */
    .form-container {
      max-width: 720px; margin: 0 auto 1.5rem; padding: clamp(1.4rem, 3vw, 2.2rem);
      background: linear-gradient(180deg, #fff, #fffaf0); border: 1px solid rgba(201,162,39,.35); border-radius: 18px; box-shadow: var(--shadow-soft);
    }
    .form-group { margin-bottom: 1.1rem; text-align: left; }
    .form-group label { display: block; margin-bottom: .4rem; font-family: var(--font-royal); font-weight: 700; font-size: .76rem; letter-spacing: .04em; color: var(--maroon); }
    .form-control {
      width: 100%; padding: .8rem .9rem; font-family: var(--font-sans); font-size: .92rem; color: var(--text-dark);
      background: #fff; border: 1px solid rgba(201,162,39,.45); border-radius: 8px; transition: .3s;
    }
    .form-control:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(201,162,39,.18); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .travel-sub-card { padding: 1.2rem; margin-bottom: 1.2rem; background: rgba(201,162,39,.06); border: 1px solid rgba(201,162,39,.28); border-radius: 12px; }
    .travel-sub-card-title { margin-bottom: .9rem; padding-bottom: .45rem; border-bottom: 1px dashed rgba(201,162,39,.45); font-family: var(--font-royal); font-weight: 700; font-size: .9rem; color: var(--maroon); text-transform: uppercase; }
    .upload-zone { padding: 1.8rem; text-align: center; cursor: pointer; border: 2px dashed rgba(201,162,39,.55); border-radius: 12px; background: rgba(201,162,39,.04); transition: .3s; }
    .upload-zone:hover { border-color: var(--gold); background: rgba(201,162,39,.1); }
    .upload-zone input { display: none; }
    .upload-icon { font-size: 2.2rem; margin-bottom: .4rem; }
    .btn {
      display: block; width: 100%; margin-top: .8rem; padding: .95rem; cursor: pointer; border: 0; border-radius: 10px;
      background: var(--maroon-foil); color: var(--gold-light); border: 1px solid var(--gold);
      font-family: var(--font-royal); font-weight: 800; font-size: .92rem; letter-spacing: .08em; text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(99,18,27,.3); transition: .3s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(99,18,27,.4); }
    .masonry-grid { column-count: 3; column-gap: 1.1rem; max-width: 900px; margin: 0 auto; padding: 14px 4px; }
    .masonry-item { margin-bottom: 1.2rem; break-inside: avoid; border-radius: 4px; background: #fff; padding: 7px 7px 16px; box-shadow: 0 6px 16px rgba(60,40,20,.16); }
    .masonry-item img { display: block; width: 100%; height: auto; min-height: 70px; background: #f3ece0; border-radius: 2px; }

    /* footer */
    footer {
      position: relative; z-index: 2; text-align: center; margin-top: 2rem;
      padding: clamp(2.4rem, 5vw, 3.4rem) 1.5rem calc(2.2rem + env(safe-area-inset-bottom));
      background: rgba(244,236,220,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border-top: 1px solid rgba(201,162,39,.4);
    }
    .footer-orn { color: var(--gold-deep); font-size: 1.1rem; letter-spacing: .6em; margin-bottom: .5rem; }
    .footer-title { font-family: 'Alex Brush', var(--font-script); font-weight: 400; -webkit-text-stroke: .5px currentColor; letter-spacing: .01em; word-spacing: .12em; font-size: clamp(2.4rem, 5.4vw, 3.4rem); line-height: 1.15; color: var(--maroon); }
    .footer-sub-text { margin-top: .5rem; color: var(--text-soft); font-size: clamp(.78rem, 1.1vw, .92rem); line-height: 1.6; letter-spacing: .01em; }

    /* ---------- responsive ---------- */
    @media (max-width: 768px) {
      section { padding: 1.4rem 1rem; }
      .page-view { --nav-h: 6.2rem; }
      .events-grid { gap: .7rem; }
      .contacts-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: .65rem; }
      .contact-card { flex: none !important; min-width: 0 !important; padding: .85rem .4rem; }
      .contact-card:nth-child(5) { grid-column: span 2; max-width: 210px; margin: 0 auto; width: 100%; }
      .venue-card { padding: 1.5rem .9rem; }
      .venue-interactive-row { gap: 1rem; }
      .wishes-grid { grid-template-columns: 1fr; }
      .masonry-grid { column-count: 2; }
      .form-grid { grid-template-columns: 1fr; gap: .8rem; }
    }
    @media (max-width: 380px) { .nav-links a { padding: .3rem .45rem; letter-spacing: .04em; } }

    /* focus, toast, lightbox, small helpers */
    a:focus-visible, button:focus-visible, [role="button"]:focus-visible, .form-control:focus-visible {
      outline: 2px solid var(--maroon); outline-offset: 2px;
    }
    .hp-field { position: absolute !important; left: -9999px !important; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .char-count { text-align: right; font-size: .7rem; color: var(--text-soft); margin-top: .25rem; }
    #toast {
      position: fixed; left: 50%; bottom: calc(1.4rem + env(safe-area-inset-bottom)); z-index: 2000;
      transform: translate(-50%, 24px); opacity: 0; pointer-events: none; transition: .35s ease;
      max-width: min(92vw, 460px); padding: .8rem 1.2rem; border-radius: 12px; text-align: center;
      background: var(--maroon-deep); color: #fff7e0; font-size: .86rem; line-height: 1.45; font-weight: 600;
      box-shadow: 0 12px 30px rgba(0,0,0,.28); border: 1px solid rgba(201,162,39,.5);
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.err { background: #7a1620; }
    .wall-head { display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap; margin: 2rem 0 1.2rem; }
    .wall-head .section-title { margin: 0 !important; }
    .mini-btn {
      cursor: pointer; padding: .4rem 1rem; border-radius: 30px; border: 1px solid rgba(201,162,39,.6); background: rgba(255,255,255,.8);
      color: var(--maroon); font-family: var(--font-sans); font-weight: 700; font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; transition: .3s;
    }
    .mini-btn:hover { background: var(--maroon); color: var(--gold-light); }
    .masonry-item { cursor: zoom-in; }
    #lightbox {
      position: fixed; inset: 0; z-index: 1500; display: none; align-items: center; justify-content: center; padding: 1rem;
      background: rgba(25,6,9,.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 100%; max-height: 90vh; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    #lightbox button { position: absolute; top: 16px; right: 16px; width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; font-size: 1.8rem; line-height: 1; background: rgba(255,255,255,.92); color: var(--maroon); }
    /* live walls: gentle random floating, new items pop in, one item glows at a time */
    @keyframes floatY {
      from { transform: translateY(calc(var(--amp, 8px) * -1)) rotate(var(--rot, 0deg)); }
      to   { transform: translateY(var(--amp, 8px)) rotate(calc(var(--rot, 0deg) * -1)); }
    }
    @keyframes popIn { from { opacity: 0; scale: .88; } to { opacity: 1; scale: 1; } }
    .masonry-item, .wish-card {
      animation: floatY var(--dur, 6s) ease-in-out var(--delay, 0s) infinite alternate, popIn .6s ease both;
      transition: scale .5s ease, box-shadow .5s ease; will-change: transform;
    }
    .masonry-item.spot, .wish-card.spot { scale: 1.06; z-index: 3; box-shadow: 0 0 0 2px rgba(184,134,11,.4), 0 16px 34px rgba(184,134,11,.28); }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      border: 1px solid rgba(201,162,39,.6); background: rgba(255,255,255,.85); color: var(--maroon); transition: .3s;
    }
    .icon-btn:hover { background: var(--maroon); color: var(--gold-light); }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn.spin svg { animation: spinOnce .8s ease; }
    @keyframes spinOnce { to { transform: rotate(360deg); } }
    .btn[disabled] { opacity: .65; cursor: progress; transform: none; }
    .footer-share { margin-top: 1.2rem; }
    .footer-share { display: flex; justify-content: center; align-items: center; gap: .6rem; flex-wrap: wrap; }
    .footer-share .cal-btn { border-color: var(--maroon); }
    /* the "&" / "एवं" / "ಮತ್ತು" in the footer couple name doubles as the PDF download button */
    .amp-btn { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; letter-spacing: inherit; -webkit-text-stroke: inherit; cursor: pointer; }
    .amp-btn:hover { color: var(--gold-deep); }
    .amp-btn:focus-visible { outline: 1px dashed var(--gold); outline-offset: 4px; border-radius: 4px; }
    .amp-btn:disabled { opacity: .5; cursor: wait; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
      .reveal { opacity: 1; transform: none; }
      html { scroll-behavior: auto; }
    }


    /* ---------- save the date only ---------- */
    .page-view { --nav-h: 0px; }
    .poster-bg { margin-top: 0; padding-top: 0; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; }
    .poster-bg .hero { width: 100%; }
    .std-title { font-family: 'Alex Brush', var(--font-script); font-weight: 400; -webkit-text-stroke: .4px currentColor; line-height: 1.1;
      font-size: clamp(2.5rem, 9vw, 3.6rem); margin: .1rem 0 .55rem; padding: .05em .15em;
      background: var(--gold-foil); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
    .hero-date { margin-top: .9rem; }
    .arch-frame { padding-bottom: calc(var(--jh-pb, 40px) + .6rem); }
  </style>
</head>
<body>
  <main class="page-view active-page" id="page-home">
    <div class="poster-bg">
      <header class="hero">
        <div class="sparkles" id="sparkles" aria-hidden="true"></div>
        <div class="hero-content">
          <div class="jh-wrap" id="jh-wrap">
            <svg class="jh-line" id="jh-line" aria-hidden="true"></svg>
            <div class="arch-frame" id="arch-frame">
              <img class="sticker-couple" src="https://drive.google.com/thumbnail?id=1rRtefG6a7BQ02axwxlnqxio9-aIaUwmL&amp;sz=w800" alt="Ashish &amp; Navya">
              <h1 class="std-title">Save the Date</h1>
              <div class="couple-hero-container">
                <div class="person-block"><span class="couple-name">Ashish</span></div>
                <div class="weds-separator">weds</div>
                <div class="person-block"><span class="couple-name">Navya</span></div>
              </div>
              <div class="hero-date"><span class="hd-day">December 4, 2026</span><span class="hd-venue">Govind Bagh, Jodhpur</span></div>
            </div>
          </div>
        </div>
      </header>
    </div>
  </main>
  <script>
    const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function drawJharokha() {
      const wrap = document.getElementById('jh-wrap'), frame = document.getElementById('arch-frame'), svg = document.getElementById('jh-line');
      if (!wrap || !frame || !svg) return;
      const w = Math.round(wrap.clientWidth), H = Math.round(frame.offsetHeight);
      if (!w || !H) return;
      const f1 = v => (Math.round(v * 10) / 10).toString(), pt = a => f1(a[0]) + ',' + f1(a[1]);
      const mob = w < 520;
      const b = mob ? 7 : 12, m = b + 3;                                        // border strip, inner margin
      const sideW = Math.round(Math.max(24, Math.min(60, w * .085)));           // flank width beside the opening
      const t = mob ? 18 : 28;                                                  // band between the two arches (at apex)
      const ah = Math.round(Math.min(104, Math.max(70, w * .15)));               // height of the opening's arch
      const y1 = m + 8, y2 = y1 + t, ys = y2 + ah;                              // outer apex, inner apex, springing line
      const bz = b + (mob ? 14 : 20), yB = H - bz;                              // sill
      wrap.style.setProperty('--jh-p', (sideW + (mob ? 8 : 18)) + 'px');
      wrap.style.setProperty('--jh-pt', Math.round(y2 + ah * .14 + 2) + 'px');
      wrap.style.setProperty('--jh-pb', (bz + (mob ? 18 : 24)) + 'px');
      const G = '#b8860b';                                                     // same gold-brown as the rotating chakra

      // ogee arch: returns {start, cmds, segs}; mirrored about the centre line
      const ogee = (x0, x1, y, a) => {
        const xm = (x0 + x1) / 2, hw = xm - x0, mir = q => [2 * xm - q[0], q[1]];
        const P0 = [x0, y], P1 = [x0, y - a * .48], Q = [x0 + hw * .62, y - a * .80], P2 = [Q[0] - hw * .20, Q[1] + a * .10];
        const C1 = [Q[0] + hw * .20, Q[1] - a * .10], C2 = [xm - hw * .02, y - a + a * .17], Ap = [xm, y - a];
        const segs = [[P0, P1, P2, Q], [Q, C1, C2, Ap], [Ap, mir(C2), mir(C1), mir(Q)], [mir(Q), mir(P2), mir(P1), mir(P0)]];
        const cmds = segs.map(s => `C${pt(s[1])} ${pt(s[2])} ${pt(s[3])}`).join(' ');
        return { start: P0, end: mir(P0), cmds, segs };
      };
      const bz3 = (s, u) => { const v = 1 - u; return [0, 1].map(k => v*v*v*s[0][k] + 3*v*v*u*s[1][k] + 3*v*u*u*s[2][k] + u*u*u*s[3][k]); };
      const equalPoints = (segs, N) => {                                          // N+1 points, equal arc length
        const poly = []; segs.forEach((s, si) => { for (let i = (si ? 1 : 0); i <= 60; i++) poly.push(bz3(s, i / 60)); });
        const cum = [0]; for (let i = 1; i < poly.length; i++) cum.push(cum[i - 1] + Math.hypot(poly[i][0] - poly[i-1][0], poly[i][1] - poly[i-1][1]));
        const out = [poly[0]]; let k = 1;
        for (let n = 1; n < N; n++) { const L = cum[cum.length - 1] * n / N; while (cum[k] < L) k++; const r = (L - cum[k-1]) / (cum[k] - cum[k-1] || 1); out.push([poly[k-1][0] + (poly[k][0] - poly[k-1][0]) * r, poly[k-1][1] + (poly[k][1] - poly[k-1][1]) * r]); }
        out.push(poly[poly.length - 1]); return out; };

      const xL = sideW, xR = w - sideW;
      const A2 = ogee(xL, xR, ys, ah), A1 = ogee(m + 1, w - m - 1, ys, ys - y1);
      const lobesN = mob ? 6 : 8, lp = equalPoints(A2.segs, lobesN);
      let lobes = `L${pt(lp[0])}`;
      for (let i = 1; i < lp.length; i++) { const c = Math.hypot(lp[i][0] - lp[i-1][0], lp[i][1] - lp[i-1][1]); lobes += ` A${f1(c * .62)},${f1(c * .62)} 0 0 1 ${pt(lp[i])}`; }
      const opening = `M${xL},${yB} L${xL},${ys} ${lobes} L${xR},${yB} Z`;
      frame.style.clipPath = `path('${opening}')`;

      const a1Line = `M${m + 1},${yB} V${ys} ${A1.cmds} V${yB}`;
      const A1in = ogee(m + 6, w - m - 6, ys, ys - y1 - 5);
      const a1Echo = `M${m + 6},${yB} V${ys} ${A1in.cmds} V${yB}`;
      const rectIn = `M${m},${m} H${w - m} V${H - m} H${m} Z`;

      // flank panels (only where there is room)
      let panels = '';
      if (sideW - m - 8 >= 30) {
        const pw = sideW - m - 9, ph = Math.round(Math.max(64, Math.min(116, w * .115))), py = yB - ph - 6;
        for (const side of [0, 1]) {
          const px = side ? w - m - 4 - pw : m + 4;
          const ac = (ax, ay, aw, ah2) => { const O = ogee(ax, ax + aw, ay + ah2, ah2 * .55); return `M${f1(ax)},${f1(ay + ah2)} V${f1(ay + ah2)} ${O.cmds} V${f1(ay + ah2)}`; };
          panels += `<rect x="${f1(px)}" y="${f1(py)}" width="${f1(pw)}" height="${ph}" fill="none" stroke="${G}" stroke-width="1" opacity=".95"/>
            <rect x="${f1(px + 3)}" y="${f1(py + 3)}" width="${f1(pw - 6)}" height="${ph - 6}" fill="none" stroke="${G}" stroke-width=".7" opacity=".7"/>
            <rect x="${f1(px + 7)}" y="${f1(py + 7)}" width="${f1(pw - 14)}" height="${ph - 14}" fill="url(#jhTile)" stroke="${G}" stroke-width=".6" opacity=".8"/>
            <path d="${ac(px + 11, py + 12, pw - 22, ph - 24)}" fill="none" stroke="${G}" stroke-width=".8"/>`;
        }
      }
      const flower = (cx, cy, r) => { let o = ''; for (let k = 0; k < 6; k++) o += `<ellipse cx="0" cy="${-r * .62}" rx="${r * .26}" ry="${r * .5}" transform="rotate(${k * 60})"/>`;
        return `<g transform="translate(${f1(cx)} ${f1(cy)})" fill="none" stroke="${G}" stroke-width=".8">${o}<circle r="${r * .2}" fill="${G}" stroke="none"/></g>`; };
      const xm = w / 2;

      svg.setAttribute('width', w); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${w} ${H}`);
      svg.style.left = '0'; svg.style.opacity = '.2';
      svg.innerHTML = `
        <defs>
          <pattern id="jhFloral" width="30" height="30" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="${G}" stroke-width=".6">
              <path d="M-2,15 Q7.5,5 15,15 T32,15" opacity=".55"/>
              <g transform="translate(7.5 7.5)"><ellipse cx="0" cy="-3.3" rx="1.5" ry="3" /><ellipse cx="0" cy="-3.3" rx="1.5" ry="3" transform="rotate(72)"/><ellipse cx="0" cy="-3.3" rx="1.5" ry="3" transform="rotate(144)"/><ellipse cx="0" cy="-3.3" rx="1.5" ry="3" transform="rotate(216)"/><ellipse cx="0" cy="-3.3" rx="1.5" ry="3" transform="rotate(288)"/></g>
              <g transform="translate(22.5 22.5) scale(.8)"><ellipse cx="0" cy="-3.3" rx="1.5" ry="3"/><ellipse cx="0" cy="-3.3" rx="1.5" ry="3" transform="rotate(72)"/><ellipse cx="0" cy="-3.3" rx="1.5" ry="3" transform="rotate(144)"/><ellipse cx="0" cy="-3.3" rx="1.5" ry="3" transform="rotate(216)"/><ellipse cx="0" cy="-3.3" rx="1.5" ry="3" transform="rotate(288)"/></g>
              <path d="M13,12 q4,-5 8,-2 q-4,5 -8,2z M2,25 q4,-5 8,-2 q-4,5 -8,2z" opacity=".7"/>
            </g>
            <circle cx="7.5" cy="7.5" r="1" fill="${G}"/><circle cx="22.5" cy="22.5" r=".9" fill="${G}"/>
          </pattern>
          <pattern id="jhTile" width="9" height="9" patternUnits="userSpaceOnUse">
            <rect x=".3" y=".3" width="8.4" height="8.4" fill="none" stroke="${G}" stroke-width=".45" opacity=".7"/><circle cx="4.5" cy="4.5" r=".8" fill="${G}" opacity=".7"/>
          </pattern>
        </defs>
        <path d="${rectIn} M${m + 1},${yB} V${ys} ${A1.cmds} V${yB} Z" fill="url(#jhFloral)" fill-rule="evenodd" opacity=".4"/>
        <path d="M${m + 1},${yB} V${ys} ${A1.cmds} V${yB} Z ${opening}" fill="url(#jhFloral)" fill-rule="evenodd" opacity=".75"/>
        <rect x="${m + 1}" y="${f1(ys + ah * .55)}" width="${xL - m - 1}" height="${f1(yB - ys - ah * .55)}" fill="url(#jhTile)" opacity=".6"/>
        <rect x="${xR}" y="${f1(ys + ah * .55)}" width="${xL - m - 1}" height="${f1(yB - ys - ah * .55)}" fill="url(#jhTile)" opacity=".6"/>
        <g fill="none" stroke="${G}" stroke-linejoin="round" stroke-linecap="round">
          <rect x=".6" y=".6" width="${w - 1.2}" height="${H - 1.2}" rx="3" stroke-width="1.3" opacity=".85"/>
          <rect x="${b}" y="${b}" width="${w - 2 * b}" height="${H - 2 * b}" rx="1.5" stroke-width=".8" opacity=".75"/>
          <rect x="${f1(b / 2)}" y="${f1(b / 2)}" width="${f1(w - b)}" height="${f1(H - b)}" rx="2" stroke-width="2.6" stroke-dasharray="0.1 7" opacity=".6"/>
          <path d="${rectIn}" stroke-width=".8" opacity=".7"/>
          <path d="${a1Line}" stroke-width="1.5" opacity=".85"/>
          <path d="${a1Echo}" stroke-width=".8" opacity=".6"/>
          <path d="${opening}" stroke-width="1.5" opacity=".9"/>
          <path d="M${xL - 5},${yB} V${ys} " stroke-width=".7" opacity=".55"/><path d="M${xR + 5},${yB} V${ys}" stroke-width=".7" opacity=".55"/>
        </g>
        ${flower(xm, (y1 + y2) / 2 + 2, mob ? 7 : 10)}
        ${panels}`;
      placeSparkles();
    }
    /* sparkles: scattered around (never on top of) the jharokha */
    function placeSparkles() {
      const box = document.getElementById('sparkles'), hero = document.querySelector('.hero'), wrap = document.getElementById('jh-wrap');
      if (!box || !hero || !wrap || REDUCED_MOTION) return;
      const hr = hero.getBoundingClientRect(), fr = wrap.getBoundingClientRect(); if (!hr.width) return;
      const pad = 10, n = hr.width > 900 ? 34 : 16; box.innerHTML = '';
      let tries = 0;
      while (box.children.length < n && tries++ < 600) {
        const x = Math.random() * hr.width, y = Math.random() * hr.height, ax = hr.left + x, ay = hr.top + y;
        if (ax > fr.left - pad && ax < fr.right + pad && ay > fr.top - pad && ay < fr.bottom + pad) continue;   // keep clear of the frame
        const el = document.createElement('i'), star = Math.random() < .55, size = star ? 8 + Math.random() * 12 : 4 + Math.random() * 6;
        el.className = 'spk ' + (star ? 'star' : 'dot'); el.style.cssText = `left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${size.toFixed(0)}px;height:${size.toFixed(0)}px;` +
          `--d:${(3.5 + Math.random() * 5).toFixed(1)}s;--dl:${(-Math.random() * 8).toFixed(1)}s;--o:${(.35 + Math.random() * .35).toFixed(2)};--dy:${(-4 - Math.random() * 10).toFixed(0)}px`;
        box.appendChild(el);
      }
    }
    let spkTimer = null;
    window.addEventListener('resize', () => { drawJharokha(); clearTimeout(spkTimer); spkTimer = setTimeout(placeSparkles, 250); });
    window.addEventListener('load', placeSparkles);
    if (window.ResizeObserver) new ResizeObserver(drawJharokha).observe(document.getElementById('arch-frame'));
    window.addEventListener('load', drawJharokha);
    drawJharokha();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawJharokha(); placeSparkles(); });
  </script>
</body>
